<style>
    .fuck-it {
        display: flex;
        position: fixed;
        top: 50%;
        right: 0;
        transform: translateY(-50%);
        background-color: #00000099;
        color: #fff;
        width: 48;
        height: 48;
        text-align: center;
        align-content: center;
        border-radius: 6px;
        flex-wrap: wrap;
        justify-content: center;
        user-select: none;
        z-index: 9999999999999;
    }
    .hidden {
        display: none;
    }
    .ai-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 100px;
        max-width: 800px;
        margin: 20px auto;
        /* 增加上下边距 */
    }

    .ai-image-container {
        position: relative;
        width: 100%;
        padding-top: 100%;
        /* 维持1:1的宽高比 */
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .ai-number {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 3rem;
        font-weight: bold;
        -webkit-user-select: none;
        user-select: none;
        pointer-events: none;
    }

    .ai-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .ai-caption {
        position: absolute;
        bottom: 5px;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 3rem;
        font-weight: bold;
        color: white;
        text-shadow: 1px 1px 3px black;
        pointer-events: none;
    }

    .ai-status-unlocked {
        cursor: pointer;
        background-color: #e0e0e0;
        transition: background-color 0.3s;
    }

    .ai-status-unlocked:hover {
        background-color: #c7c7c7;
    }

    .ai-status-unlocked .ai-number {
        color: #333;
    }

    .ai-status-locked {
        cursor: not-allowed;
        background-color: #111;
    }

    .ai-status-locked .ai-number {
        color: #555;
    }

    .ai-status-solved {
        cursor: default;
        background-color: #fff;
    }

    .ai-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        /* 禁止背景滚动 */
        overflow: hidden;
    }

    #ai-game-canvas {
        background-color: #333;
        border: 2px solid #fff;
        /* 消除移动端触摸延迟 */
        touch-action: manipulation;
    }

    /* ==================== 移动端适配 ==================== */
    @media (max-width: 768px) {
        .ai-grid {
            /* 在小屏幕上单列显示 */
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 90%;
            /* 占据屏幕大部分宽度 */
        }

        .ai-number {
            font-size: 2.5rem;
            /* 适当缩小数字 */
        }

        .ai-caption {
            font-size: 1.8rem;
            /* 适当缩小文字 */
            bottom: 2px;
        }

        #ai-game-canvas {
            /* 让画布适应屏幕宽度，保持1:1比例 */
            width: 90vw;
            height: 90vw;
            max-width: 320px;
            /* 限制最大尺寸 */
            max-height: 320px;
        }

        .ai-image-container {
            /* 确保在图片加载前有足够的点击区域 */
            min-height: 150px;
        }
    }
</style>
<div class="fuck-it hidden" id="fuck-it">
    一键<br />通关

    <div id="ai-container-1" class="ai-image-container
                        ai-status-unlocked" data-index="1">

                        ai-status-unlocked" data-index="3">

    <div id="ai-container-4" class="ai-image-container
                        ai-status-unlocked" data-index="4">
        <span class="ai-number">4</span>
    </div>
    <div id="ai-container-5" class="ai-image-container

<div class="ai-modal-overlay" id="ai-modal">
    <canvas id="ai-game-canvas" width="450" height="450"></canvas>
</div>

<script>
    const AIPUZZLE_DATA = {
        1: {
            url: "/config/seco2/static/assets/ai_D5B2C45F89DA53940622E30823C7D06B19_36e01c337816fdb387270e7a98f60a00.png",
            text: "(1/9)",
        },
        2: {
            url: "/config/seco2/static/assets/ai_D5B2C45F89DA53940622E30823C7D06B37_d3ab46de0a2651a9592b9acec0d8a9ca.png",
            text: "(3/7)",
        },
        3: {
            url: "/config/seco2/static/assets/ai_D5B2C45F89DA53940622E30823C7D06B16_6d49c941dc31d1488d932b5b92f11c19.png",
            text: "(1/6)",
        },
        4: {
            url: "/config/seco2/static/assets/ai_D5B2C45F89DA53940622E30823C7D06B48_c29dfa9205cc1771fdf5e875eeab07e1.png",
            text: "(4/8)",
        },
        5: {
            url: "/config/seco2/static/assets/ai_D5B2C45F89DA53940622E30823C7D06B49_e1716219f7c29a5c50a570449e3d4ec2.png",
            text: "(4/9)",
        },
        6: {
            url: "/config/seco2/static/assets/ai_D5B2C45F89DA53940622E30823C7D06B59_fef2e70355c159b41126a27918b526db.png",
            text: "(5/9)",
        },
    };

    const apiCall = console.debug;
    document.addEventListener('DOMContentLoaded', () => {
        const modal = document.getElementById('ai-modal');
        const canvas = document.getElementById('ai-game-canvas');
        const fucker = document.getElementById('fuck-it');
        const ctx = canvas.getContext('2d');
        const apiUrl = "{% url 'ai_api' %}";
        const csrfToken = "{{ csrf_token }}";

        const SIZE = 3;
        let TILE_SIZE = canvas.width / SIZE; // 改为动态计算
        const EMPTY_TILE = SIZE * SIZE - 1;

        let currentImage = null;
        let currentIndex = 0;
        let currentImageText = '';
        let board = [];
        let emptyPos = { row: 0, col: 0 };
        const solvedState = [...Array(SIZE * SIZE).keys()];

        // --- 游戏主逻辑 (增加触摸坐标记录) ---
        let touchStartX = 0;
        let touchStartY = 0;
        const SWIPE_THRESHOLD = 20; // 滑动识别阈值

        async function startGame(index) {
            currentIndex = index;

            const result = AIPUZZLE_DATA[currentIndex];

            const { url, text } = result;
            currentImageText = text;

            currentImage = new Image();
            // currentImage.crossOrigin = "Anonymous";
            currentImage.src = url;
            currentImage.onload = () => {
                // 重新计算 Tile Size，以防 canvas 尺寸变化
                TILE_SIZE = canvas.width / SIZE;
                board = [...solvedState];
                shuffleBoard();
                updateEmptyPos();
                drawBoard();
                modal.style.display = 'flex';
                document.addEventListener('keydown', handleKeyPress);
                fucker.addEventListener('click', justFuckingFuckItIDontFuckingCareWhatTheFuckThisFuckingFuckIs);
                fucker.classList.remove('hidden');
                // 禁止页面滚动
                // document.body.style.overflow = 'hidden';
            };
            currentImage.onerror = () => { alert(`无法从指定的URL加载图片: ${url}`); }
        }

        function justFuckingFuckItIDontFuckingCareWhatTheFuckThisFuckingFuckIs() {
            checkWin(true);
        }

        // --- 绘制函数 (无改动) ---
        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < board.length; i++) {
                const tileValue = board[i];
                if (tileValue === EMPTY_TILE) continue;
                const targetCol = i % SIZE, targetRow = Math.floor(i / SIZE);
                const sourceCol = tileValue % SIZE, sourceRow = Math.floor(tileValue / SIZE);
                ctx.drawImage(
                    currentImage,
                    sourceCol * (currentImage.width / SIZE),
                    sourceRow * (currentImage.height / SIZE),
                    currentImage.width / SIZE,
                    currentImage.height / SIZE,
                    targetCol * TILE_SIZE,
                    targetRow * TILE_SIZE,
                    TILE_SIZE,
                    TILE_SIZE
                );
            }
        }

        // --- 键盘事件 (无改动) ---
        function handleKeyPress(e) {
            if (['w', 's', 'a', 'd', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
            }
            let moved = false;
            switch (e.key) {
                case 'w': case 'ArrowUp': moved = move(emptyPos.row + 1, emptyPos.col); break;
                case 's': case 'ArrowDown': moved = move(emptyPos.row - 1, emptyPos.col); break;
                case 'a': case 'ArrowLeft': moved = move(emptyPos.row, emptyPos.col + 1); break;
                case 'd': case 'ArrowRight': moved = move(emptyPos.row, emptyPos.col - 1); break;
                case 'l': checkWin(true);break;
            }
            if (moved) {
                drawBoard();
                checkWin();
            }
        }

        // --- 移动逻辑 (无改动) ---
        function move(targetRow, targetCol) {
            if (targetRow < 0 || targetRow >= SIZE || targetCol < 0 || targetCol >= SIZE) return false;
            const emptyIndex = emptyPos.row * SIZE + emptyPos.col;
            const targetIndex = targetRow * SIZE + targetCol;
            [board[emptyIndex], board[targetIndex]] = [board[targetIndex], board[emptyIndex]];
            updateEmptyPos();
            return true;
        }

        function updateEmptyPos() {
            const index = board.indexOf(EMPTY_TILE);
            emptyPos.row = Math.floor(index / SIZE);
            emptyPos.col = index % SIZE;
        }

        // --- 洗牌逻辑 (无改动) ---
        function shuffleBoard() {
            let tempBoard = [...solvedState];
            let tempEmptyPos = { row: SIZE - 1, col: SIZE - 1 };
            const moves = 200;
            for (let i = 0; i < moves; i++) {
                const possibleMoves = [];
                const { row, col } = tempEmptyPos;
                if (row > 0) possibleMoves.push({ r: row - 1, c: col });
                if (row < SIZE - 1) possibleMoves.push({ r: row + 1, c: col });
                if (col > 0) possibleMoves.push({ r: row, c: col - 1 });
                if (col < SIZE - 1) possibleMoves.push({ r: row, c: col + 1 });
                const randomMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                const emptyIndex = tempEmptyPos.row * SIZE + tempEmptyPos.col;
                const targetIndex = randomMove.r * SIZE + randomMove.c;
                [tempBoard[emptyIndex], tempBoard[targetIndex]] = [tempBoard[targetIndex], tempBoard[emptyIndex]];
                tempEmptyPos = { row: randomMove.r, col: randomMove.c };
            }
            if (tempBoard.every((val, index) => val === index)) {
                return shuffleBoard();
            }
            board = tempBoard;
        }



        // --- 胜利检测 ---
        async function checkWin(b=false) {
            if (board.every((val, index) => val === index)||b) {
                board = [0,1,2,3,4,5,6,7,8];
                drawBoard();
                document.removeEventListener('keydown', handleKeyPress);
                fucker.removeEventListener('keydown', justFuckingFuckItIDontFuckingCareWhatTheFuckThisFuckingFuckIs);
                fucker.classList.add('hidden');
                const lastPieceIndex = board.indexOf(EMPTY_TILE);
                const targetCol = lastPieceIndex % SIZE, targetRow = Math.floor(lastPieceIndex / SIZE);
                ctx.drawImage(
                    currentImage,
                    targetCol * (currentImage.width / SIZE),
                    targetRow * (currentImage.height / SIZE),
                    currentImage.width / SIZE,
                    currentImage.height / SIZE,
                    targetCol * TILE_SIZE,
                    targetRow * TILE_SIZE,
                    TILE_SIZE,
                    TILE_SIZE
                );

                const result = await apiCall({ action: 'solve', puzzle_index: currentIndex });
                setTimeout(() => {
                    modal.style.display = 'none';
                    document.body.style.overflow = ''; // 恢复页面滚动
                    updateMainPageUI(currentIndex, currentImage.src, currentImageText);
                }, 1500);
            }
        }

        // --- UI 更新 (无改动) ---
        function updateMainPageUI(newSolvedLevel, solvedImageUrl, solvedImageText) {
            const solvedContainer = document.getElementById(`ai-container-${currentIndex}`);
            if (solvedContainer) {
                solvedContainer.className = 'ai-image-container ai-status-solved';
                solvedContainer.innerHTML = '';

                const imgSolved = document.createElement('img');
                imgSolved.className = 'ai-image';
                imgSolved.src = solvedImageUrl;
                solvedContainer.appendChild(imgSolved);

                const caption = document.createElement('div');
                caption.className = 'ai-caption';
                caption.innerText = solvedImageText;
                solvedContainer.appendChild(caption);
            }

            const nextIndex = currentIndex + 1;
            if (nextIndex <= 6) {
                const nextContainer = document.getElementById(`ai-container-${nextIndex}`);
                if (nextContainer) {
                    nextContainer.className = 'ai-image-container ai-status-unlocked';
                    nextContainer.addEventListener('click', () => {
                        if (nextContainer.classList.contains('ai-status-unlocked')) {
                            startGame(parseInt(nextContainer.dataset.index));
                        }
                    });
                }
            }
        }

        // --- 页面初始化 (无改动) ---
        async function initializePage() {
            const result = await apiCall({ action: 'get_solved_data' });

            document.querySelectorAll('.ai-status-unlocked').forEach(container => {
                container.addEventListener('click', () => {
                    if (container.classList.contains('ai-status-unlocked')) {
                        startGame(parseInt(container.dataset.index));
                    }
                });
            });
        }

        // --- 初始化事件监听 ---
        initializePage();

        // 关闭模态窗口事件
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
                document.removeEventListener('keydown', handleKeyPress);
                fucker.removeEventListener('keydown', justFuckingFuckItIDontFuckingCareWhatTheFuckThisFuckingFuckIs);
                fucker.classList.add('hidden');
                document.body.style.overflow = ''; // 恢复页面滚动
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            // 阻止事件冒泡，防止点击 canvas 背景关闭窗口
            e.stopPropagation();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        });

        canvas.addEventListener('touchend', (e) => {
            // 阻止事件冒泡
            e.stopPropagation();
            const touch = e.changedTouches[0];
            const touchEndX = touch.clientX;
            const touchEndY = touch.clientY;

            // 计算滑动距离
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;

            let moved = false;

            if (Math.abs(dx) > Math.abs(dy)) {
                // 水平滑动
                if (dx > SWIPE_THRESHOLD) {
                    // 向右滑
                    moved = move(emptyPos.row, emptyPos.col - 1);
                } else if (dx < -SWIPE_THRESHOLD) {
                    // 向左滑
                    moved = move(emptyPos.row, emptyPos.col + 1);
                }
            } else {
                // 垂直滑动
                if (dy > SWIPE_THRESHOLD) {
                    // 向下滑
                    moved = move(emptyPos.row - 1, emptyPos.col);
                } else if (dy < -SWIPE_THRESHOLD) {
                    // 向上滑
                    moved = move(emptyPos.row + 1, emptyPos.col);
                }
            }

            if (moved) {
                drawBoard();
                checkWin();
            }
        });
        // 禁止触摸时的默认行为（如双指缩放）
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

    });
</script>
