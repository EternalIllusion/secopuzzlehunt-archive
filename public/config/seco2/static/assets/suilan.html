<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>随蓝百练</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .suilan-container { 
            max-width: 900px; 
            margin: auto; 
            padding: 20px; 
            background-color: #f0f0f0; 
            border-radius: 12px; 
        }
        .suilan-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            padding: 10px; 
            background: #fff; 
            border-radius: 8px; 
            font-size: 1.2rem; 
            flex-wrap: wrap; 
        }
        .suilan-header > * { 
            margin: 5px 10px; 
        }
        .suilan-grid { 
            display: grid; 
            grid-template-columns: repeat(10, 1fr); 
            gap: 10px; 
        }
        .suilan-item { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 60px; 
            font-size: 1.5rem; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.2s; 
            user-select: none; 
        }
        .suilan-item:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 4px 8px rgba(0,0,0,0.2); 
        }
        .item-locked { 
            background-color: #a0a0a0; 
            color: #666; 
            cursor: not-allowed; 
        }
        .item-unlocked { 
            background-color: #e0e0e0; 
            color: #333; 
        }
        .item-solved { 
            background-color: #4CAF50; 
            color: white; 
        }
        .suilan-modal-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.6); 
            display: none; 
            z-index: 1000; 
        }
        .suilan-modal-content { 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%) scale(0.95); 
            background-color: white; 
            padding: 30px; 
            border-radius: 10px; 
            width: 90%; 
            max-width: 700px; 
            max-height: 90vh; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 5px 25px rgba(0,0,0,0.4); 
            opacity: 0; 
            transition: opacity 0.2s ease, transform 0.2s ease; 
        }
        .suilan-modal-close { 
            position: absolute; 
            top: 10px; 
            right: 15px; 
            font-size: 2rem; 
            cursor: pointer; 
            border: none; 
            background: none; 
        }
        #suilan-modal-question { 
            flex-grow: 1; 
            overflow-y: auto; 
            background: #f9f9f9; 
            padding: 15px; 
            border-radius: 5px; 
            margin-bottom: 15px; 
            white-space: pre-wrap; 
        }
        #suilan-answer-input { 
            width: 100%; 
            padding: 8px; 
            margin: 10px 0; 
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        hr {
            border: 0;
            height: 1px;
            background: #ddd;
            margin: 10px 0;
        }
    </style>
</head>

                "亚热带季风气候的过渡区，",
                "是我国重要的热带作物",
                "产区，与海南岛隔海相望。",
            ],
            "95": [
                "【Y1】根据《墨子》的记载，在春秋战国时，这",
                "种动物就已经大量分布于长江中。",
                "在《西游记》中，它和八十一难中的",
                "一难息息相关，不过在此之前也为",
                "唐僧师徒通过通天河帮了大忙。",
            ],
            "96": [
                "【N5】这句诗在全诗的开头和结尾都有",
                "出现，它用一个当时无法完成的",
                "动作为全诗描写的道路留下了",
                "第一印象。然而后世有人却反其",
                "道而行之，称此道路“易于履平地”。",
            ],
            "97": [
                "【F4】在《哆啦A梦》中，大雄用这种",
                "食物的图片和品尝汤勺",
                "治理了吹牛的小夫。该食物",
                "产自北欧，是一种发酵产",
                "品，因为气味极臭而得名。",
            ],
            "98": [
                "【L2】在《横竖撇点折》中，它在对联中与",
                "“谐”字相对。其最早出现于秦汉",
                "时期，虽然你能在许多火车站看",
                "到它，但它与原始版本差距极",
                "大，只是一种压扁的楷书而已。",
            ],
            "99": [
                "【M4】这个词和某个网络流行语一",
                "样，都用颜色来形容发怒的",
                "情况，不同的是它也可以指",
                "羞愧或尴尬的表情，比如孔",
                "乙己被揭穿偷书时的脸色。",
            ],
            "100": [
                "【X4】这句古文给出了一个气味分",
                "子浓度影响嗅觉的现象，因",
                "为随着距离增大，作者认为莲",
                "花的气味越来越清芬，这也",
                "就是其“独爱莲”的原因之一。",
            ],
        };

        // 游戏状态管理
        class GameState {
            constructor() {
                this.score = 400;
                this.hints = 0; // 提示点数量
                this.itemsStatus = {};
                
                // 初始化所有题目状态
                for (let i = 1; i <= 100; i++) {
                    this.itemsStatus[i.toString()] = {
                        status: "locked",
                        hintLevel: 1,
                        attemptsLeft: 3
                    };
                }
                
                // 解锁第一题
                this.itemsStatus["1"].status = "unlocked";
            }
            
            saveToLocalStorage() {
                localStorage.setItem('suilanGameState', JSON.stringify({
                    score: this.score,
                    hints: this.hints,
                    itemsStatus: this.itemsStatus
                }));
            }
            
            loadFromLocalStorage() {
                const saved = localStorage.getItem('suilanGameState');
                if (saved) {
                    const data = JSON.parse(saved);
                    this.score = data.score || 400;
                    this.hints = data.hints || 0;
                    this.itemsStatus = data.itemsStatus || this.itemsStatus;
                }
            }
        }

        // 创建游戏状态实例
        const gameState = new GameState();
        gameState.loadFromLocalStorage();

        // DOM元素
        const gridContainer = document.querySelector('.suilan-grid');
        const scoreDisplay = document.getElementById('suilan-score');
        const modal = document.getElementById('suilan-modal');
        const modalContent = document.getElementById('suilan-modal-content');
        const closeModalBtn = document.getElementById('suilan-modal-close-btn');
        const modalTitle = document.getElementById('suilan-modal-title');
        const modalQuestion = document.getElementById('suilan-modal-question');
        const modalAnswerSection = document.getElementById('suilan-modal-answer-section');
        const modalAnswerDisplay = document.getElementById('suilan-modal-answer');
        const modalInteractiveSection = document.getElementById('suilan-modal-interactive-section');
        const buyHintBtn = document.getElementById('suilan-buy-hint-btn');
        const buyAttemptBtn = document.getElementById('suilan-buy-attempt-btn');
        const answerInput = document.getElementById('suilan-answer-input');
        const submitBtn = document.getElementById('suilan-submit-btn');
        const attemptsLeftDisplay = document.getElementById('suilan-attempts-left');
        const feedbackDisplay = document.getElementById('suilan-feedback');
        const unlockExtraBtn = document.getElementById('unlock-extra-puzzle-btn');
        const exchangeHintBtn = document.getElementById('exchange-hint-for-score-btn');
        const finalImageContainer = document.getElementById('suilan-final-image-container');

        let currentItemId = null;

        // 生成题目网格
        function renderGrid() {
            gridContainer.innerHTML = '';
            for (let i = 1; i <= 100; i++) {
                const itemId = i.toString();
                const itemData = gameState.itemsStatus[itemId];
                const itemElement = document.createElement('div');
                itemElement.className = `suilan-item item-${itemData.status}`;
                itemElement.dataset.itemId = itemId;
                itemElement.textContent = itemId;
                
                if (itemData.status !== 'locked') {
                    itemElement.addEventListener('click', () => {
                        currentItemId = itemId;
                        openModal();
                    });
                }
                
                gridContainer.appendChild(itemElement);
            }
        }

        // 更新分数显示
        function updateScoreDisplay() {
            scoreDisplay.textContent = gameState.score;
        }

        // 打开模态框
        async function openModal() {
            modal.style.display = 'block';
            requestAnimationFrame(() => {
                modalContent.style.opacity = '1';
                modalContent.style.transform = 'translate(-50%, -50%) scale(1)';
            });
            
            const itemData = gameState.itemsStatus[currentItemId];
            modalTitle.textContent = `小题 ${currentItemId}`;
            
            if (itemData.status === 'solved') {
                // 显示完整题目和答案
                const fullQuestion = SUILAN_HINTS[currentItemId].join('');
                const correctAnswerRaw = SUILAN_ANSWERS[currentItemId];
                const correctAnswer = Array.isArray(correctAnswerRaw) 
                    ? correctAnswerRaw.join(' / ') 
                    : correctAnswerRaw;
                
                modalQuestion.textContent = fullQuestion;
                modalAnswerDisplay.textContent = correctAnswer;
                modalAnswerSection.style.display = 'block';
                modalInteractiveSection.style.display = 'none';
            } else {
                // 显示当前提示级别
                const hintLevel = itemData.hintLevel;
                const fullText = SUILAN_HINTS[currentItemId];
                const questionText = fullText.slice(0, hintLevel).join('');
                
                modalQuestion.textContent = questionText;
                attemptsLeftDisplay.textContent = itemData.attemptsLeft;
                
                // 更新提示按钮状态
                const canBuyHint = hintLevel < fullText.length;
                if (canBuyHint) {
                    buyHintBtn.style.display = 'inline-block';
                    buyHintBtn.textContent = `解锁下一段 (2积分)`;
                } else {
                    buyHintBtn.style.display = 'none';
                }
                
                // 更新提交按钮状态
                const hasAttempts = itemData.attemptsLeft > 0;
                submitBtn.disabled = !hasAttempts;
                answerInput.disabled = !hasAttempts;
                
                modalAnswerSection.style.display = 'none';
                modalInteractiveSection.style.display = 'block';
            }
        }

        // 关闭模态框
        function closeModal() {
            modalContent.style.opacity = '0';
            modalContent.style.transform = 'translate(-50%, -50%) scale(0.95)';
            setTimeout(() => {
                modal.style.display = 'none';
            }, 200);
        }

        // 检查是否所有题目都已解锁
        function checkAllUnlocked() {
            const hasLocked = Object.values(gameState.itemsStatus).some(item => item.status === 'locked');
            if (!hasLocked) {
                // 所有题目都已解锁，显示最终图片
                showFinalImage();
            }
        }

        // 显示最终图片
        function showFinalImage() {
            const img = document.createElement('img');
            img.src = 'https://image.secopuzzle.com/SECO2/101.jpg';
            img.alt = 'Congratulations!';
            img.style.maxWidth = '100%';
            img.style.borderRadius = '10px';
            finalImageContainer.innerHTML = '';
            finalImageContainer.appendChild(img);
            finalImageContainer.style.display = 'block';
        }

        // 事件监听器
        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        // 提交答案
        submitBtn.addEventListener('click', () => {
            const answer = answerInput.value.trim();
            if (!answer) return;
            
            feedbackDisplay.textContent = '正在提交...';
            
            const itemData = gameState.itemsStatus[currentItemId];
            itemData.attemptsLeft -= 1;
            
            const correctAnswers = SUILAN_ANSWERS[currentItemId];
            const isCorrect = Array.isArray(correctAnswers) 
                ? correctAnswers.includes(answer)
                : answer === correctAnswers;
            
            if (isCorrect) {
                itemData.status = 'solved';
                
                // 寻找下一个要解锁的题目
                let nextUnlockedId = null;
                for (let i = 1; i <= 100; i++) {
                    const id = i.toString();
                    if (gameState.itemsStatus[id].status === 'locked') {
                        gameState.itemsStatus[id].status = 'unlocked';
                        nextUnlockedId = id;
                        break;
                    }
                }
                
                feedbackDisplay.textContent = '回答正确！';
                feedbackDisplay.style.color = 'green';
                
                // 更新界面
                renderGrid();
                updateScoreDisplay();
                
                // 如果没有下一个解锁的题目，显示最终图片
                if (!nextUnlockedId) {
                    setTimeout(() => {
                        showFinalImage();
                        closeModal();
                    }, 1000);
                } else {
                    setTimeout(closeModal, 1000);
                }
            } else {
                feedbackDisplay.textContent = '回答错误，请再试一次。';
                feedbackDisplay.style.color = 'red';
                attemptsLeftDisplay.textContent = itemData.attemptsLeft;
                
                if (itemData.attemptsLeft <= 0) {
                    submitBtn.disabled = true;
                    answerInput.disabled = true;
                }
            }
            
            gameState.saveToLocalStorage();
        });

        // 购买提示
        buyHintBtn.addEventListener('click', () => {
            const itemData = gameState.itemsStatus[currentItemId];
            const fullText = SUILAN_HINTS[currentItemId];
            
            if (itemData.hintLevel >= fullText.length) {
                alert('没有更多提示了');
                return;
            }
            
            if (gameState.score < 2) {
                alert('积分不足');
                return;
            }
            
            gameState.score -= 2;
            itemData.hintLevel += 1;
            
            // 更新题目显示
            const hintLevel = itemData.hintLevel;
            const questionText = fullText.slice(0, hintLevel).join('');
            modalQuestion.textContent = questionText;
            
            // 更新提示按钮
            const canBuyHint = hintLevel < fullText.length;
            if (canBuyHint) {
                buyHintBtn.textContent = `解锁下一段 (2积分)`;
            } else {
                buyHintBtn.style.display = 'none';
            }
            
            updateScoreDisplay();
            gameState.saveToLocalStorage();
        });

        // 购买提交次数
        buyAttemptBtn.addEventListener('click', () => {
            if (gameState.score < 50) {
                alert('积分不足');
                return;
            }
            
            gameState.score -= 50;
            gameState.itemsStatus[currentItemId].attemptsLeft += 1;
            
            attemptsLeftDisplay.textContent = gameState.itemsStatus[currentItemId].attemptsLeft;
            submitBtn.disabled = false;
            answerInput.disabled = false;
            
            updateScoreDisplay();
            gameState.saveToLocalStorage();
        });

        // 解锁额外题目
        unlockExtraBtn.addEventListener('click', () => {
            if (gameState.score < 20) {
                alert('积分不足，无法解锁新题');
                return;
            }
            
            let newlyUnlockedId = null;
            for (let i = 1; i <= 100; i++) {
                const id = i.toString();
                if (gameState.itemsStatus[id].status === 'locked') {
                    gameState.itemsStatus[id].status = 'unlocked';
                    newlyUnlockedId = id;
                    break;
                }
            }
            
            if (!newlyUnlockedId) {
                alert('所有题目均已解锁');
                return;
            }
            
            gameState.score -= 20;
            updateScoreDisplay();
            renderGrid();
            
            alert(`成功解锁第 ${newlyUnlockedId} 题！`);
            gameState.saveToLocalStorage();
        });

        // 兑换积分
        exchangeHintBtn.addEventListener('click', () => {
            if (gameState.hints < 1) {
                alert('提示点不足！');
                return;
            }
            
            gameState.hints -= 1;
            gameState.score += 50;
            
            updateScoreDisplay();
            alert(`兑换成功！获得了 50 积分。\n您当前剩余 ${gameState.hints} 个提示点。`);
            gameState.saveToLocalStorage();
        });

        // 初始化游戏
        renderGrid();
        updateScoreDisplay();
        checkAllUnlocked();
    </script>
</body>
</html>
