<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻将牌</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; margin: 0; padding: 20px; background: transparent; }
        .mj-container { max-width: 900px; margin: auto; background: #f9f9fb; padding: 18px; border-radius: 8px; }
        .mj-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 8px; align-items: center; }
        .mj-tile { position: relative; background: #fff; border-radius: 6px; padding: 6px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); cursor: pointer; transition: all 0.2s; aspect-ratio: 1 / 1.4; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .mj-tile:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .mj-tile img { width: 100%; height: auto; display: block; object-fit: contain; pointer-events: none; }
        .mj-tile.locked { opacity: 0.4; cursor: not-allowed; background: #e0e0e0; pointer-events: none; }
        .mj-tile.locked img { visibility: hidden; }
        .mj-tile.locked:hover { transform: none; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .mj-tile.locked::before { content: '🔒'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2rem; pointer-events: none; }
        .mj-tile.solved { border: 3px solid #4CAF50; }
        .mj-tile-answer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(76, 175, 80, 0.85); color: white; font-weight: bold; font-size: 3.2rem; display: none; z-index: 10; align-items: center; justify-content: center; pointer-events: none; padding: 8px 4px; flex-wrap: wrap; line-height: 1.1; text-align: center; letter-spacing: 0.15em; }
        .mj-tile.solved .mj-tile-answer { display: flex; }
        .mj-divider { grid-column: 1 / -1; height: 1px; background: linear-gradient(to right, transparent, #ddd 10%, #ddd 90%, transparent); margin: 8px 0; pointer-events: none; }
        .mj-section-title { grid-column: 1 / -1; font-weight: 700; margin: 8px 0; }
        .mj-controls { margin-top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .mj-hint-note { color: #666; }

        /* Modal styles */
        .mj-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); display: none; z-index: 1000; }
        .mj-modal-content { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.95); background-color: white; padding: 30px; border-radius: 10px; width: 90%; max-width: 600px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 5px 25px rgba(0,0,0,0.4); opacity: 0; transition: opacity 0.2s ease, transform 0.2s ease; }
        .mj-modal-close { position: absolute; top: 10px; right: 15px; font-size: 2rem; cursor: pointer; border: none; background: none; }
        .mj-modal-close:hover { color: #666; }
        .mj-modal-image { text-align: center; margin: 20px 0; }
        .mj-modal-image img { max-width: 200px; height: auto; }
        .mj-modal-info { margin: 15px 0; }
        .mj-modal-submit { margin-top: 15px; }
        .mj-modal-submit input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; }
        .mj-modal-feedback { margin-top: 10px; font-weight: bold; }
        .mj-exchange-buttons { display: flex; gap: 10px; margin: 15px 0; }
        
        /* Buttons */
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; transition: background-color 0.2s; }
        .btn-primary { background-color: #2196F3; color: white; }
        .btn-primary:hover { background-color: #1976D2; }
        .btn-primary:disabled { background-color: #BDBDBD; cursor: not-allowed; }
        .btn-secondary { background-color: #9C27B0; color: white; }
        .btn-secondary:hover { background-color: #7B1FA2; }
        
        /* Status display */
        .status-bar { margin-top: 20px; padding: 15px; background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .status-bar p { margin: 5px 0; }
        
        /* Reset button */
        .reset-section { margin-top: 20px; text-align: center; }
        .reset-btn { background-color: #f44336; color: white; padding: 10px 30px; }
        .reset-btn:hover { background-color: #d32f2f; }

        /* Debug/Cheat buttons */
        .debug-section { margin-top: 15px; text-align: center; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .debug-btn { padding: 8px 16px; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; font-size: 0.9rem; background-color: #f5f5f5; }
        .debug-btn:hover { background-color: #e0e0e0; }
        .unlock-all-btn { background-color: #FF9800; color: white; border: none; }
        .unlock-all-btn:hover { background-color: #F57C00; }
        .solve-all-btn { background-color: #4CAF50; color: white; border: none; }
        .solve-all-btn:hover { background-color: #388E3C; }
    </style>
</head>
<body>

<div class="mj-container">
    <h2 style="text-align: center; margin-bottom: 10px;">麻将牌</h2>
    <p>这是一款源于叶子戏的游戏……</p>
    <p>提交答案默认使用简体</p>
    
    <div class="mj-grid">
        <!-- 万 (1-9) -->
        <div class="mj-tile" data-tile-id="1"><img src="" alt="1"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="2"><img src="" alt="2"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="3"><img src="" alt="3"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="4"><img src="" alt="4"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="5"><img src="" alt="5"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="6"><img src="" alt="6"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="7"><img src="" alt="7"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="8"><img src="" alt="8"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="9"><img src="" alt="9"><div class="mj-tile-answer"></div></div>
        <div class="mj-divider"></div>

        <!-- 筒 (1-9) -->
        <div class="mj-tile" data-tile-id="10"><img src="" alt="1"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="11"><img src="" alt="2"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="12"><img src="" alt="3"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="13"><img src="" alt="4"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="14"><img src="" alt="5"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="15"><img src="" alt="6"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="16"><img src="" alt="7"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="17"><img src="" alt="8"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="18"><img src="" alt="9"><div class="mj-tile-answer"></div></div>
        <div class="mj-divider"></div>

        <!-- 条 (1-9) -->
        <div class="mj-tile" data-tile-id="19"><img src="" alt="1"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="20"><img src="" alt="2"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="21"><img src="" alt="3"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="22"><img src="" alt="4"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="23"><img src="" alt="5"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="24"><img src="" alt="6"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="25"><img src="" alt="7"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="26"><img src="" alt="8"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="27"><img src="" alt="9"><div class="mj-tile-answer"></div></div>
        <div class="mj-divider"></div>

        <!-- 风牌 -->
        <div class="mj-tile" data-tile-id="28"><img src="" alt="东"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="29"><img src="" alt="南"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="30"><img src="" alt="西"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="31"><img src="" alt="北"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="32"><img src="" alt="中"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="33"><img src="" alt="发"><div class="mj-tile-answer"></div></div>
        <div class="mj-tile" data-tile-id="34"><img src="" alt="白"><div class="mj-tile-answer"></div></div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar">
        <p><strong>已解决：</strong><span id="solved-count">0</span> / 34</p>
        <p><strong>提示点：</strong><span id="hint-balance">10.00</span></p>
        <p><strong>尝试次数：</strong><span id="attempts">5</span></p>
    </div>

    <!-- 功能按钮 -->
    <div class="debug-section">
        <button class="debug-btn unlock-all-btn" onclick="unlockAllTiles()">全部解锁</button>
        <button class="debug-btn solve-all-btn" onclick="solveAllTiles()">全部通过</button>
    </div>

    <!-- 重置按钮 -->
    <div class="reset-section">
        <button class="btn reset-btn" onclick="resetGame()">重置游戏进度</button>
    </div>
</div>

<!-- Modal -->
<div class="mj-modal-overlay" id="mj-modal">
    <div class="mj-modal-content" id="mj-modal-content">
        <button class="mj-modal-close" id="mj-modal-close">&times;</button>

        <div class="mj-modal-image">
            <img id="mj-modal-img" src="" alt="">
        </div>

        <div class="mj-modal-info">
            <p><strong>状态：</strong><span id="mj-tile-status"></span></p>
            <p id="mj-cooldown-info" style="display:none;"><strong>冷却时间：</strong><span id="mj-cooldown-time">0</span> 秒</p>
            <p id="mj-answer-display" style="display:none;"><strong>答案：</strong><span id="mj-tile-answer" style="color: #4CAF50; font-size: 1.2rem;"></span></p>
        </div>

        <div id="mj-interactive-section">
            <div class="mj-exchange-buttons">
                <button id="mj-exchange-answer" class="btn btn-secondary">直接兑换答案</button>
            </div>

            <div class="mj-modal-submit">
                <input type="text" id="mj-answer-input" placeholder="输入答案">
                <button id="mj-submit-btn" class="btn btn-primary">提交答案</button>
                <p class="mj-modal-feedback" id="mj-feedback"></p>
            </div>
        </div>
    </div>
</div>

<script>
// 麻将牌配置：34 张牌，每张牌对应一个答案
const MAJIANG_TILES = {
    // 万 (m) 1-9
    1: { answer: "厉", hint_cost: 0.5, group: "wan", unlock: "initial", image: "images/1m.png" },
    2: { answer: "急", hint_cost: 0.5, group: "wan", unlock: "initial", image: "images/2m.png" },
    3: { answer: "扫描", hint_cost: 0.5, group: "wan", unlock: "initial", image: "images/3m.png" },
    4: { answer: "众", hint_cost: 0.5, group: "wan", unlock: "initial", image: "images/4m.png" },
    5: { answer: "万年历", hint_cost: 0.5, group: "wan", unlock: "initial", image: "images/5m.png" },
    6: { answer: "旁", hint_cost: 0.5, group: "wan", unlock: "initial", image: "images/6m.png" },
    7: { answer: "花", hint_cost: 0.5, group: "wan", unlock: "initial", image: "images/7m.png" },
    8: { answer: "应援", hint_cost: 0.5, group: "wan", unlock: "initial", image: "images/8m.png" },
    9: { answer: "好逑", hint_cost: 3, group: "wan", unlock: "wan_6", image: "images/9m.png" },
    // 筒 (p) 1-9
    10: { answer: "饺", hint_cost: 0.5, group: "tong", unlock: "initial", image: "images/1p.png" },
    11: { answer: "简并", hint_cost: 0.5, group: "tong", unlock: "initial", image: "images/2p.png" },
    12: { answer: "葵", hint_cost: 0.5, group: "tong", unlock: "initial", image: "images/3p.png" },
    13: { answer: "嚣", hint_cost: 0.5, group: "tong", unlock: "initial", image: "images/4p.png" },
    14: { answer: "梧桐", hint_cost: 0.5, group: "tong", unlock: "initial", image: "images/5p.png" },
    15: { answer: "合同", hint_cost: 0.5, group: "tong", unlock: "initial", image: "images/6p.png" },
    16: { answer: "朝三暮四", hint_cost: 0.5, group: "tong", unlock: "initial", image: "images/7p.png" },
    17: { answer: "正统", hint_cost: 0.5, group: "tong", unlock: "initial", image: "images/8p.png" },
    18: { answer: "正交", hint_cost: 3, group: "tong", unlock: "tong_6", image: "images/9p.png" },
    // 条 (s) 1-9
    19: { answer: "玄机", hint_cost: 0.5, group: "tiao", unlock: "initial", image: "images/1s.png" },
    20: { answer: "萦", hint_cost: 0.5, group: "tiao", unlock: "initial", image: "images/2s.png" },
    21: { answer: "条目", hint_cost: 0.5, group: "tiao", unlock: "initial", image: "images/3s.png" },
    22: { answer: "雷", hint_cost: 0.5, group: "tiao", unlock: "initial", image: "images/4s.png" },
    23: { answer: "七夕", hint_cost: 0.5, group: "tiao", unlock: "initial", image: "images/5s.png" },
    24: { answer: "页", hint_cost: 0.5, group: "tiao", unlock: "initial", image: "images/6s.png" },
    25: { answer: "杀伤", hint_cost: 0.5, group: "tiao", unlock: "initial", image: "images/7s.png" },
    26: { answer: "求", hint_cost: 0.5, group: "tiao", unlock: "initial", image: "images/8s.png" },
    27: { answer: "朝贡", hint_cost: 3, group: "tiao", unlock: "tiao_6", image: "images/9s.png" },
    // 风牌
    28: { answer: "薪", hint_cost: 1, group: "feng", unlock: "all_9", image: "images/dong.png" },
    29: { answer: "语", hint_cost: 1, group: "feng", unlock: "all_9", image: "images/nan.png" },
    30: { answer: "式", hint_cost: 1, group: "feng", unlock: "all_9", image: "images/xi.png" },
    31: { answer: "鄂", hint_cost: 1, group: "feng", unlock: "all_9", image: "images/bei.png" },
    // 三元牌
    32: { answer: "色", hint_cost: 3, group: "sanyuan", unlock: "all_feng", image: "images/zhong.png" },
    33: { answer: "混", hint_cost: 3, group: "sanyuan", unlock: "all_feng", image: "images/fa.png" },
    34: { answer: "", hint_cost: 3, group: "sanyuan", unlock: "all_feng", image: "images/bai.png", view_only: true },
};

// 游戏状态
const STORAGE_KEY = 'majiang_game_state';
const INITIAL_ATTEMPTS = 5;
const INITIAL_HINTS = 32767.0;

let gameState = {
    tiles: {},  // 每张牌的状态
    hint_balance: INITIAL_HINTS,
    attempts: INITIAL_ATTEMPTS
};

// DOM 元素
const tiles = document.querySelectorAll('.mj-tile');
const modal = document.getElementById('mj-modal');
const modalContent = document.getElementById('mj-modal-content');
const closeBtn = document.getElementById('mj-modal-close');
const modalImg = document.getElementById('mj-modal-img');
const tileStatusEl = document.getElementById('mj-tile-status');
const cooldownInfo = document.getElementById('mj-cooldown-info');
const cooldownTime = document.getElementById('mj-cooldown-time');
const answerDisplay = document.getElementById('mj-answer-display');
const tileAnswerEl = document.getElementById('mj-tile-answer');
const interactiveSection = document.getElementById('mj-interactive-section');
const answerInput = document.getElementById('mj-answer-input');
const submitBtn = document.getElementById('mj-submit-btn');
const feedback = document.getElementById('mj-feedback');
const exchangeAnswerBtn = document.getElementById('mj-exchange-answer');
const hintBalanceEl = document.getElementById('hint-balance');
const solvedCountEl = document.getElementById('solved-count');
const attemptsEl = document.getElementById('attempts');

let currentTileId = null;
let cooldownTimer = null;

// 初始化游戏状态
function initGameState() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        try {
            gameState = JSON.parse(saved);
        } catch (e) {
            console.error('加载存档失败:', e);
            gameState = createInitialState();
        }
    } else {
        gameState = createInitialState();
    }
}

// 创建初始状态
function createInitialState() {
    const state = {
        tiles: {},
        hint_balance: INITIAL_HINTS,
        attempts: INITIAL_ATTEMPTS,
        all_unlocked: false  // 全部解锁标志
    };
    // 初始化所有牌
    for (let i = 1; i <= 34; i++) {
        state.tiles[i] = {
            solved: false,
            last_submit_time: null
        };
    }
    return state;
}

// 保存游戏状态
function saveGameState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
}

// 获取解锁的牌
function getUnlockedTiles() {
    const unlocked = new Set();

    // 检查是否全部解锁（作弊模式）
    if (gameState.all_unlocked) {
        for (let i = 1; i <= 34; i++) {
            unlocked.add(i);
        }
        return unlocked;
    }

    // 获取已解决的牌
    const solvedTiles = new Set();
    for (let i = 1; i <= 34; i++) {
        if (gameState.tiles[i]?.solved) {
            solvedTiles.add(i);
        }
    }

    // 1. Initial unlock: 1-8 of all three suits
    for (let i = 1; i <= 8; i++) unlocked.add(i);      // 万 1-8
    for (let i = 10; i <= 17; i++) unlocked.add(i);    // 筒 1-8
    for (let i = 19; i <= 26; i++) unlocked.add(i);    // 条 1-8

    // 2. Unlock 9 of each suit when 6 of that suit are solved
    const wanSolved = [1,2,3,4,5,6,7,8].filter(t => solvedTiles.has(t)).length;
    if (wanSolved >= 6) unlocked.add(9);

    const tongSolved = [10,11,12,13,14,15,16,17].filter(t => solvedTiles.has(t)).length;
    if (tongSolved >= 6) unlocked.add(18);

    const tiaoSolved = [19,20,21,22,23,24,25,26].filter(t => solvedTiles.has(t)).length;
    if (tiaoSolved >= 6) unlocked.add(27);

    // 3. Unlock 东南西北 when all three 9s are solved
    if (solvedTiles.has(9) && solvedTiles.has(18) && solvedTiles.has(27)) {
        unlocked.add(28);
        unlocked.add(29);
        unlocked.add(30);
        unlocked.add(31);
    }

    // 4. Unlock 中发白 when all four 风牌 are solved
    if (solvedTiles.has(28) && solvedTiles.has(29) && solvedTiles.has(30) && solvedTiles.has(31)) {
        unlocked.add(32);
        unlocked.add(33);
        unlocked.add(34);
    }

    return unlocked;
}

// 更新牌显示
function updateTilesDisplay() {
    const unlockedTiles = getUnlockedTiles();
    let solvedCount = 0;

    tiles.forEach(tile => {
        const tileId = parseInt(tile.dataset.tileId);
        const tileData = MAJIANG_TILES[tileId];
        const img = tile.querySelector('img');
        const answerDiv = tile.querySelector('.mj-tile-answer');
        const tileState = gameState.tiles[tileId];

        tile.classList.remove('locked', 'solved');

        if (!unlockedTiles.has(tileId)) {
            // 未解锁
            tile.classList.add('locked');
            img.src = '';
            if (answerDiv) answerDiv.textContent = '';
        } else if (tileData) {
            // 已解锁：显示图片
            img.src = tileData.image;
            if (tileState?.solved) {
                tile.classList.add('solved');
                solvedCount++;
                // 显示答案叠加层
                if (answerDiv && tileData.answer) {
                    const answer = tileData.answer;
                    // 四字答案排成 2x2
                    if (answer.length === 4) {
                        answerDiv.innerHTML = answer.substring(0, 2) + '<br>' + answer.substring(2);
                    } else {
                        answerDiv.textContent = answer;
                    }
                }
            } else {
                tile.classList.remove('solved');
                if (answerDiv) answerDiv.textContent = '';
            }
        }
    });

    // 更新状态栏
    solvedCountEl.textContent = solvedCount;
    hintBalanceEl.textContent = gameState.hint_balance.toFixed(2);
    attemptsEl.textContent = gameState.attempts;

    // 检查是否完成所有牌
    if (solvedCount === 34) {
        console.log('🎉 恭喜！已完成所有麻将牌！');
    }
}

// 打开模态框
function openModal(tileId) {
    currentTileId = tileId;
    const unlockedTiles = getUnlockedTiles();

    // 检查是否已解锁
    if (!unlockedTiles.has(tileId)) {
        alert('此牌尚未解锁！');
        return;
    }

    const tileData = MAJIANG_TILES[tileId];
    const tileState = gameState.tiles[tileId];

    // 设置图片
    modalImg.src = tileData.image;
    modalImg.alt = tileId.toString();

    // 设置状态
    if (tileState?.solved) {
        tileStatusEl.textContent = '已完成';
        tileStatusEl.style.color = '#4CAF50';
        cooldownInfo.style.display = 'none';
        interactiveSection.style.display = 'none';
        answerDisplay.style.display = 'block';
        tileAnswerEl.textContent = tileData.answer || '(答案未设置)';
    } else if (tileData.view_only) {
        tileStatusEl.textContent = '查看';
        tileStatusEl.style.color = '#9C27B0';
        cooldownInfo.style.display = 'none';
        interactiveSection.style.display = 'none';
        answerDisplay.style.display = 'none';
    } else {
        tileStatusEl.textContent = '可答题';
        tileStatusEl.style.color = '#2196F3';
        interactiveSection.style.display = 'block';
        answerDisplay.style.display = 'none';

        // 计算冷却时间
        const lastSubmitTime = tileState?.last_submit_time;
        if (lastSubmitTime) {
            const currentTime = Date.now() / 1000;
            const timeSinceSubmit = currentTime - lastSubmitTime;
            const cooldownRemaining = Math.max(0, 60 - timeSinceSubmit);

            if (cooldownRemaining > 0) {
                cooldownInfo.style.display = 'block';
                cooldownTime.textContent = Math.ceil(cooldownRemaining);
                submitBtn.disabled = true;
                startCooldownTimer(cooldownRemaining);
            } else {
                cooldownInfo.style.display = 'none';
                submitBtn.disabled = false;
            }
        } else {
            cooldownInfo.style.display = 'none';
            submitBtn.disabled = false;
        }

        // 更新兑换按钮文本
        exchangeAnswerBtn.textContent = `直接兑换答案 (${tileData.hint_cost} 提示点)`;
    }

    feedback.textContent = '';
    answerInput.value = '';

    // 显示模态框
    modal.style.display = 'block';
    requestAnimationFrame(() => {
        modalContent.style.opacity = '1';
        modalContent.style.transform = 'translate(-50%, -50%) scale(1)';
    });
}

// 关闭模态框
function closeModal() {
    if (cooldownTimer) {
        clearInterval(cooldownTimer);
        cooldownTimer = null;
    }
    modalContent.style.opacity = '0';
    modalContent.style.transform = 'translate(-50%, -50%) scale(0.95)';
    setTimeout(() => {
        modal.style.display = 'none';
    }, 200);
}

// 启动冷却倒计时
function startCooldownTimer(seconds) {
    if (cooldownTimer) clearInterval(cooldownTimer);

    let remaining = Math.ceil(seconds);
    cooldownTimer = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
            clearInterval(cooldownTimer);
            cooldownTimer = null;
            cooldownInfo.style.display = 'none';
            submitBtn.disabled = false;
        } else {
            cooldownTime.textContent = remaining;
        }
    }, 1000);
}

// 提交答案
function submitAnswer() {
    const answer = answerInput.value.trim();
    if (!answer) {
        feedback.textContent = '请输入答案';
        feedback.style.color = '#f44336';
        return;
    }

    // 检查尝试次数
    if (gameState.attempts <= 0) {
        feedback.textContent = '尝试次数已用完！可用提示点兑换。';
        feedback.style.color = '#f44336';
        return;
    }

    feedback.textContent = '提交中...';
    feedback.style.color = '#2196F3';
    submitBtn.disabled = true;

    const tileData = MAJIANG_TILES[currentTileId];
    const correctAnswer = tileData.answer.toUpperCase();
    const submission = answer.toUpperCase();
    const isCorrect = submission === correctAnswer;

    // 更新状态
    const currentTime = Date.now() / 1000;
    gameState.tiles[currentTileId].last_submit_time = currentTime;
    gameState.attempts--;

    if (isCorrect) {
        gameState.tiles[currentTileId].solved = true;
        feedback.textContent = '✓ 回答正确！';
        feedback.style.color = '#4CAF50';
        setTimeout(() => {
            closeModal();
            saveGameState();
            updateTilesDisplay();
        }, 1000);
    } else {
        feedback.textContent = '✗ 答案错误，请等待 60 秒后再次尝试';
        feedback.style.color = '#f44336';
        cooldownInfo.style.display = 'block';
        cooldownTime.textContent = '60';
        startCooldownTimer(60);
    }

    saveGameState();
    updateTilesDisplay();
}

// 兑换答案
function exchangeAnswer() {
    const tileData = MAJIANG_TILES[currentTileId];
    const cost = tileData.hint_cost;

    if (gameState.hint_balance < cost) {
        alert('提示点不足！');
        return;
    }

    if (!confirm(`确定消耗 ${cost} 提示点直接获取答案？`)) return;

    // 消耗提示点
    gameState.hint_balance -= cost;
    alert(`答案是：${tileData.answer}`);
    
    saveGameState();
    updateTilesDisplay();
    closeModal();
}

// 兑换尝试次数
function exchangeAttempts() {
    const HINT_COST = 1.0;
    const ATTEMPTS_GAIN = 3;

    if (gameState.hint_balance < HINT_COST) {
        alert('提示点不足！需要 1 点提示点兑换 3 次尝试。');
        return;
    }

    if (!confirm(`确定消耗 ${HINT_COST} 提示点兑换 ${ATTEMPTS_GAIN} 次尝试机会？`)) return;

    gameState.hint_balance -= HINT_COST;
    gameState.attempts += ATTEMPTS_GAIN;
    
    saveGameState();
    updateTilesDisplay();
    alert('兑换成功！获得 3 次尝试机会。');
}

// 全部解锁
function unlockAllTiles() {
    if (!confirm('确定要解锁所有麻将牌吗？这将显示所有题目，但不会自动完成。')) return;
    
    gameState.all_unlocked = true;
    
    // 确保所有牌的状态都存在
    for (let i = 1; i <= 34; i++) {
        if (!gameState.tiles[i]) {
            gameState.tiles[i] = { solved: false, last_submit_time: null };
        }
    }
    
    saveGameState();
    updateTilesDisplay();
    alert('所有牌已解锁！现在可以点击任意牌进行答题了。\n\n提示：点击"重置游戏进度"可以恢复未解锁状态。');
}

// 全部通过
function solveAllTiles() {
    if (!confirm('确定要直接通过所有麻将牌吗？此操作将标记所有牌为已解决状态。')) return;
    
    // 确保所有牌的状态都存在并标记为已解决
    for (let i = 1; i <= 34; i++) {
        if (!gameState.tiles[i]) {
            gameState.tiles[i] = { solved: false, last_submit_time: null };
        }
        gameState.tiles[i].solved = true;
    }
    
    saveGameState();
    updateTilesDisplay();
    alert('恭喜！所有麻将牌已通过！');
}

// 重置游戏
function resetGame() {
    if (confirm('确定要重置游戏进度吗？此操作不可恢复！')) {
        localStorage.removeItem(STORAGE_KEY);
        gameState = createInitialState();
        saveGameState();
        updateTilesDisplay();
        alert('游戏已重置！');
    }
}

// 事件监听
document.addEventListener('DOMContentLoaded', () => {
    initGameState();
    updateTilesDisplay();

    console.log('麻将牌模块加载，找到', tiles.length, '张牌');
    tiles.forEach((tile, index) => {
        if (!tile.dataset.tileId) {
            return;
        }
        tile.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const tileId = parseInt(tile.dataset.tileId);
            openModal(tileId);
        });
    });

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
    });
    submitBtn.addEventListener('click', submitAnswer);
    answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') submitAnswer();
    });
    exchangeAnswerBtn.addEventListener('click', exchangeAnswer);

    console.log('开始加载状态...');
});
</script>
