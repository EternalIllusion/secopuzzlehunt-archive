<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盲人摸字</title>
    <style>
        .blind-container {
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
        }

        .blind-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .blind-info {
            font-size: 1.1rem;
        }

        .blind-canvas-wrapper {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 20px auto;
            border: 2px solid #333;
            background: white;
        }

        #blind-canvas {
            cursor: crosshair;
            display: block;
        }

        /* 字形显示开关样式 */
        .show-char-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            justify-content: center;
        }

        .show-char-toggle label {
            cursor: pointer;
            user-select: none;
        }

        .dev-toggle {
            color: #dc3545;
        }

        .blind-controls {
            max-width: 400px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .blind-input-group {
            display: flex;
            gap: 10px;
        }

        #blind-input {
            flex: 1;
            padding: 10px;
            font-size: 1rem;
        }

        .blind-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .blind-buttons button {
            flex: 1;
            min-width: 120px;
        }

        .blind-feedback {
            min-height: 2rem;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .blind-feedback.success {
            background-color: #d4edda;
            color: #155724;
        }

        .blind-feedback.error {
            background-color: #f8d7da;
            color: #721c24;
        }

        .blind-feedback.info {
            background-color: #d1ecf1;
            color: #0c5460;
        }

        .blind-instructions {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #007bff;
        }

        .blind-instructions h3 {
            margin-top: 0;
            color: #007bff;
        }

        .blind-instructions ul {
            margin: 10px 0;
            padding-left: 20px;
        }

        .blind-instructions li {
            margin: 5px 0;
        }

        .blind-extra-rules {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 6px;
            background: #fff3cd;
            border: 1px solid #ffe08a;
            color: #6b4e00;
            font-weight: bold;
            display: none;
        }

        .blind-level-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .blind-level-btn {
            padding: 8px 16px;
            border: 2px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }

        .blind-level-btn.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }

        .blind-level-btn.completed {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }

        .blind-level-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .blind-extract-btn {
            padding: 8px 16px;
            border: 2px solid #ffc107;
            background: #ffc107;
            color: #000;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }

        .blind-extract-btn:hover {
            background: #ffb300;
            border-color: #ffb300;
        }

        /* 按钮基础样式 */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            background-color: #007bff;
            color: white;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #6c757d;
        }

        .btn-danger {
            background-color: #dc3545;
        }

        .btn-warning {
            background-color: #ffc107;
            color: #000;
        }

        /* 开发版样式 */
        .dev-badge {
            display: inline-block;
            padding: 2px 8px;
            background: #dc3545;
            color: white;
            border-radius: 3px;
            font-size: 0.8rem;
            margin-left: 10px;
        }

        /* 字形显示模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        .pixel-display {
            display: grid;
            gap: 1px;
            background: #eee;
            border: 2px solid #333;
            margin: 15px auto;
        }

        .pixel-cell {
            width: 8px;
            height: 8px;
        }

        .pixel-cell.on {
            background: #000;
        }

        .pixel-cell.off {
            background: #fff;
        }

        .modal-close-btn {
            margin-top: 15px;
            padding: 10px 30px;
            font-size: 1rem;
        }

        .dev-controls {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border: 2px dashed #999;
            display: flex;
            flex-wrap: wrap;
            flex-direction: row;
            justify-content: space-between;
        }

        .dev-controls h4 {
            margin-top: 0;
            color: #dc3545;
        }

        .dev-controls .dev-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .dev-controls>* {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .reset-all {
            text-decoration: underline;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="blind-container">
        <div class="blind-instructions">
            <h3>📝 游戏规则</h3>
            <ul>
                <li><strong>拖动探针：</strong>用鼠标拖动红色 (A) 和蓝色 (B) 两个探针</li>
                <li><strong>观察长度：</strong>连接线上显示"加权长度 / 实际长度"</li>
                <li><strong>长度计算：</strong>经过汉字部分的长度×4，未经过部分×1</li>
                <li><strong>比例提示：</strong>连线旁边显示"加权长度÷实际长度"，范围 1.0~4.0</li>
                <li><strong>猜测汉字：</strong>根据探针感知的轮廓，猜出隐藏的汉字</li>
                <li><strong>提交答案：</strong>每关有 10 次提交机会</li>
            </ul>
            <div id="blind-extra-rules" class="blind-extra-rules"></div>
        </div>

        <div class="blind-header">
            <div class="blind-info">
                <span>当前关卡：<strong id="blind-level-display">1</strong> / <strong
                        id="blind-total-levels">6</strong></span>
            </div>
            <div class="blind-info">
                <span>剩余次数：<strong id="blind-attempts-display">10</strong></span>
            </div>
            <div class="blind-info">
                <span>提示点：<strong id="blind-hints-display">32767.00</strong></span>
            </div>
        </div>

        <div class="blind-level-nav" id="blind-level-nav">
            <!-- 关卡按钮将由 JS 动态生成 -->
        </div>

        <div class="blind-canvas-wrapper">
            <canvas id="blind-canvas" width="400" height="400"></canvas>
        </div>

        <div class="blind-controls">
            <div style="text-align: center; font-size: 1.2rem; font-weight: bold; color: #666;">
                长度比例：<span id="blind-ratio-display">1.00</span>
            </div>

            <div class="blind-input-group">
                <input type="text" id="blind-input" placeholder="输入你猜的汉字" maxlength="2">
                <button id="blind-submit-btn" class="btn">提交答案</button>
            </div>

            <div class="blind-buttons">
                <button id="blind-reset-btn" class="btn btn-secondary">重置探针</button>
                <button id="blind-toggle-grid-btn" class="btn btn-secondary">切换网格</button>
                <button id="blind-exchange-btn" class="btn btn-warning">+ 次数</button>
            </div>

            <div id="blind-feedback" class="blind-feedback"></div>
        </div>

        <div class="dev-controls">
            <h4>🔧 存档站功能</h4>
            <div class="show-char-toggle">
                <input type="checkbox" id="show-char-checkbox">
                <label for="show-char-checkbox">显示当前关汉字</label>
            </div>

            <div class="show-char-toggle dev-toggle">
                <input type="checkbox" id="disable-rules-checkbox">
                <label for="disable-rules-checkbox">禁用附加规则</label>
            </div>
            <div class="dev-buttons">
                <label id="blind-reset-all-btn" class="dev-toggle reset-all">重置所有进度</label>
            </div>
        </div>
    </div>

    <!-- 字形显示模态框已移除，改为直接在 Canvas 上显示 -->

    <script>
        // ==================== 游戏配置 ====================
        const BLIND_LEVELS = [
            { level: 1, character: "火" },
            { level: 2, character: "牙" },
            { level: 3, character: "纪" },
            { level: 4, character: "空" },
            { level: 5, character: "钱" },
            { level: 6, character: "越" },
        ];

        const INITIAL_ATTEMPTS = 10;
        const HINT_COST_FOR_ATTEMPTS = 1.0;
        const ATTEMPTS_PER_HINT = 10;
        const INITIAL_HINTS = 32767;  // 开发版：初始 32767 提示点

        // ==================== 游戏状态 ====================
        let gameState = {
            level: 1,
            attempts: 10,
            completedLevels: [],
            totalLevels: 6,
            showGrid: true,
            showChar: false,  // 是否显示汉字
            disableRules: false,  // 是否禁用附加规则
            hintBalance: INITIAL_HINTS,
            attemptsByLevel: {},
        };

        // ==================== 探针状态 ====================
        const probeA = { x: 50, y: 200 };
        const probeB = { x: 350, y: 200 };

        // ==================== 长度计算结果 ====================
        let lengthData = {
            actual: 0,
            weighted: 0,
            ratio: 1,
        };

        // ==================== 像素掩码缓存 ====================
        const pixelMasks = {};

        // ==================== DOM 元素缓存 ====================
        let canvas, ctx;
        let levelDisplay, totalLevelsDisplay, attemptsDisplay, hintsDisplay;
        let ratioDisplay, inputField, submitBtn, resetBtn, toggleGridBtn, exchangeBtn;
        let feedbackEl, levelNavEl, extraRulesEl;
        let resetAllBtn, showCharCheckbox, disableRulesCheckbox;

        // ==================== 常量 ====================
        const PROBE_RADIUS = 6;
        const CANVAS_SIZE = 400;
        const CHAR_DISPLAY_SCALE = 0.25;  // 字形显示缩放比例（400x400 -> 100x100 显示）

        // ==================== 各关卡附加规则 ====================
        const EXTRA_RULES = {
            4: '附加规则：不显示连线旁边的长度。',
            5: '附加规则：A 点固定不可移动。',
            6: '附加规则：拖动时只允许水平或垂直方向移动。',
        };

        // ==================== 生成像素掩码 ====================
        function generatePixelMask(character) {
            const offCanvas = document.createElement('canvas');
            offCanvas.width = CANVAS_SIZE;
            offCanvas.height = CANVAS_SIZE;
            const offCtx = offCanvas.getContext('2d');

            offCtx.fillStyle = 'white';
            offCtx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            offCtx.fillStyle = 'black';
            offCtx.font = 'bold 320px "SimHei", "Microsoft YaHei", "Heiti SC", sans-serif';
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillText(character, CANVAS_SIZE / 2, CANVAS_SIZE / 2);

            const imageData = offCtx.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            const pixels = imageData.data;

            const totalPixels = CANVAS_SIZE * CANVAS_SIZE;
            const byteLength = Math.ceil(totalPixels / 8);
            const mask = new Uint8Array(byteLength);

            for (let y = 0; y < CANVAS_SIZE; y++) {
                for (let x = 0; x < CANVAS_SIZE; x++) {
                    const i = (y * CANVAS_SIZE + x) * 4;
                    const isBlack = pixels[i] < 128;

                    if (isBlack) {
                        const pixelIndex = y * CANVAS_SIZE + x;
                        const byteIndex = Math.floor(pixelIndex / 8);
                        const bitIndex = pixelIndex % 8;
                        mask[byteIndex] |= (1 << bitIndex);
                    }
                }
            }

            return mask;
        }

        // ==================== 预生成所有关卡的像素掩码 ====================
        function preloadPixelMasks() {
            for (const lvl of BLIND_LEVELS) {
                pixelMasks[lvl.level] = generatePixelMask(lvl.character);
            }
        }

        // ==================== 像素检测函数 ====================
        function isPixelOnCharacter(x, y, level) {
            const mask = pixelMasks[level];
            if (!mask) return false;
            if (x < 0 || x >= CANVAS_SIZE || y < 0 || y >= CANVAS_SIZE) return false;

            const pixelIndex = y * CANVAS_SIZE + x;
            const byteIndex = Math.floor(pixelIndex / 8);
            const bitIndex = pixelIndex % 8;

            return (mask[byteIndex] & (1 << bitIndex)) !== 0;
        }

        // ==================== 计算加权长度 ====================
        function calculateWeightedLength() {
            const dx = probeB.x - probeA.x;
            const dy = probeB.y - probeA.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 0.1) {
                lengthData = { actual: 0, weighted: 0, ratio: 1 };
                return;
            }

            const segments = Math.max(100, Math.floor(distance));
            let weightedLength = 0;

            for (let i = 0; i < segments; i++) {
                const t = i / segments;
                const x = Math.floor(probeA.x + dx * t);
                const y = Math.floor(probeA.y + dy * t);
                const segmentLength = distance / segments;

                if (isPixelOnCharacter(x, y, gameState.level)) {
                    weightedLength += segmentLength * 4;
                } else {
                    weightedLength += segmentLength;
                }
            }

            weightedLength = Math.min(weightedLength, distance * 4);
            const ratio = distance > 0.1 ? weightedLength / distance : 1;

            lengthData = {
                actual: Math.round(distance * 100) / 100,
                weighted: Math.round(weightedLength * 100) / 100,
                ratio: Math.round(ratio * 100) / 100,
            };
        }

        // ==================== Canvas 绘制函数 ====================
        function drawCanvas() {
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            if (gameState.showGrid) {
                ctx.strokeStyle = '#e0e0e0';
                ctx.lineWidth = 0.5;
                for (let i = 0; i <= CANVAS_SIZE; i += 20) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i, CANVAS_SIZE);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i);
                    ctx.lineTo(CANVAS_SIZE, i);
                    ctx.stroke();
                }

                ctx.strokeStyle = '#b0b0b0';
                ctx.lineWidth = 1;
                for (let i = 0; i <= CANVAS_SIZE; i += 100) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i, CANVAS_SIZE);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i);
                    ctx.lineTo(CANVAS_SIZE, i);
                    ctx.stroke();
                }
            }

            // 绘制汉字像素图（在网格之上，探针之下）
            if (gameState.showChar) {
                drawCharPixels();
            }

            ctx.strokeStyle = '#28a745';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(probeA.x, probeA.y);
            ctx.lineTo(probeB.x, probeB.y);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#ffcccc';
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(probeA.x, probeA.y, PROBE_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ff0000';
            ctx.font = 'bold 10px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('A', probeA.x, probeA.y - PROBE_RADIUS - 4);

            ctx.fillStyle = '#ccccff';
            ctx.strokeStyle = '#0000ff';
            ctx.beginPath();
            ctx.arc(probeB.x, probeB.y, PROBE_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#0000ff';
            ctx.fillText('B', probeB.x, probeB.y - PROBE_RADIUS - 4);

            // 如果禁用了附加规则，第 4 关也显示长度
            if (gameState.level !== 4 || gameState.disableRules) {
                const midX = (probeA.x + probeB.x) / 2;
                const midY = (probeA.y + probeB.y) / 2;
                const dx = probeB.x - probeA.x;
                const dy = probeB.y - probeA.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                let offsetX = 0, offsetY = -20;
                if (distance > 0) {
                    offsetX = (-dy / distance) * 20;
                    offsetY = (dx / distance) * 20;
                }

                const text = `${lengthData.weighted.toFixed(1)} / ${lengthData.actual.toFixed(1)}`;
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                const textWidth = ctx.measureText(text).width;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.fillRect(midX + offsetX - textWidth / 2 - 3, midY + offsetY - 8, textWidth + 6, 16);

                ctx.fillStyle = '#28a745';
                ctx.font = 'bold 10px Arial';
                ctx.fillText(text, midX + offsetX, midY + offsetY);
            }
        }

        // ==================== 绘制汉字像素 ====================
        function drawCharPixels() {
            const mask = pixelMasks[gameState.level];
            if (!mask) return;

            const displaySize = Math.floor(CANVAS_SIZE * CHAR_DISPLAY_SCALE);  // 100
            const step = Math.floor(CANVAS_SIZE / displaySize);  // 4
            const offset = (CANVAS_SIZE - displaySize * step) / 2;  // 居中偏移

            for (let y = 0; y < displaySize; y++) {
                for (let x = 0; x < displaySize; x++) {
                    const sampleX = x * step + Math.floor(step / 2);
                    const sampleY = y * step + Math.floor(step / 2);

                    const pixelIndex = sampleY * CANVAS_SIZE + sampleX;
                    const byteIndex = Math.floor(pixelIndex / 8);
                    const bitIndex = pixelIndex % 8;
                    const isOn = (mask[byteIndex] & (1 << bitIndex)) !== 0;

                    if (isOn) {
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';  // 半透明黑色
                        ctx.fillRect(
                            offset + x * step,
                            offset + y * step,
                            step,
                            step
                        );
                    }
                }
            }
        }

        // ==================== 探针拖动处理 ====================
        let draggingProbe = null;
        let dragStartPos = { x: 0, y: 0 };

        function handlePointerDown(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const distA = Math.sqrt((x - probeA.x) ** 2 + (y - probeA.y) ** 2);
            const distB = Math.sqrt((x - probeB.x) ** 2 + (y - probeB.y) ** 2);

            // 如果禁用了附加规则，第 5 关也可以移动 A 点
            if (distA <= PROBE_RADIUS && (gameState.level !== 5 || gameState.disableRules)) {
                draggingProbe = 'A';
                dragStartPos = { x, y };
            } else if (distB <= PROBE_RADIUS) {
                draggingProbe = 'B';
                dragStartPos = { x, y };
            }
        }

        function handlePointerMove(e) {
            if (!draggingProbe) return;

            const rect = canvas.getBoundingClientRect();
            let x = Math.max(0, Math.min(CANVAS_SIZE, e.clientX - rect.left));
            let y = Math.max(0, Math.min(CANVAS_SIZE, e.clientY - rect.top));

            // 如果禁用了附加规则，第 6 关不受方向限制
            if (gameState.level === 6 && !gameState.disableRules) {
                const dx = Math.abs(x - dragStartPos.x);
                const dy = Math.abs(y - dragStartPos.y);

                if (dx > dy) {
                    y = draggingProbe === 'A' ? probeA.y : probeB.y;
                } else {
                    const deltaY = y - (draggingProbe === 'A' ? probeA.y : probeB.y);
                    probeA.y = Math.max(0, Math.min(CANVAS_SIZE, probeA.y + deltaY));
                    probeB.y = Math.max(0, Math.min(CANVAS_SIZE, probeB.y + deltaY));
                    calculateWeightedLength();
                    drawCanvas();
                    ratioDisplay.textContent = lengthData.ratio.toFixed(2);
                    return;
                }
            }

            if (draggingProbe === 'A') {
                probeA.x = x;
                probeA.y = y;
            } else {
                probeB.x = x;
                probeB.y = y;
            }

            calculateWeightedLength();
            drawCanvas();
            ratioDisplay.textContent = lengthData.ratio.toFixed(2);
        }

        function handlePointerUp() {
            draggingProbe = null;
        }

        // ==================== 重置探针位置 ====================
        function resetProbes() {
            if (gameState.level === 5) {
                probeA.x = PROBE_RADIUS;
                probeA.y = CANVAS_SIZE - PROBE_RADIUS;
                probeB.x = 350;
                probeB.y = 200;
            } else if (gameState.level === 6) {
                probeA.x = 50;
                probeA.y = 200;
                probeB.x = 350;
                probeB.y = 200;
            } else {
                probeA.x = 50;
                probeA.y = 200;
                probeB.x = 350;
                probeB.y = 200;
            }

            calculateWeightedLength();
            drawCanvas();
            ratioDisplay.textContent = lengthData.ratio.toFixed(2);
        }

        // ==================== 提交答案 ====================
        function submitAnswer() {
            const answer = inputField.value.trim();
            if (!answer) {
                showFeedback('请输入答案', 'error');
                return;
            }

            const currentLevelData = BLIND_LEVELS[gameState.level - 1];
            const correctAnswer = currentLevelData.character;

            const levelKey = String(gameState.level);
            if (!gameState.attemptsByLevel[levelKey]) {
                gameState.attemptsByLevel[levelKey] = INITIAL_ATTEMPTS;
            }

            if (gameState.attemptsByLevel[levelKey] <= 0) {
                showFeedback('提交次数已用完，请使用 + 次数按钮', 'error');
                return;
            }

            gameState.attemptsByLevel[levelKey]--;
            gameState.attempts = gameState.attemptsByLevel[levelKey];
            attemptsDisplay.textContent = gameState.attempts;

            if (answer === correctAnswer) {
                if (!gameState.completedLevels.includes(gameState.level)) {
                    gameState.completedLevels.push(gameState.level);
                }

                const completedCount = gameState.completedLevels.length;

                if (completedCount >= 5) {
                    const completedChars = gameState.completedLevels.map(i => BLIND_LEVELS[i - 1].character);
                    showFeedback(`恭喜！答案正确：${correctAnswer}。你已完成${completedCount}题，通关成功！\n解出的汉字：${completedChars.join(' ')}`, 'success');
                    setTimeout(() => alert('恭喜通关！'), 500);
                } else {
                    showFeedback(`恭喜！答案正确：${correctAnswer}。已完成 ${completedCount}/5 题`, 'success');
                }

                renderLevelNav();
                inputField.value = '';
            } else {
                if (gameState.attemptsByLevel[levelKey] === 0) {
                    showFeedback('次数已用完！请使用 + 次数按钮', 'error');
                } else {
                    showFeedback(`答案错误，还剩 ${gameState.attemptsByLevel[levelKey]} 次机会`, 'error');
                }
            }
        }

        // ==================== 兑换提示点 ====================
        function exchangeHints() {
            if (gameState.hintBalance < HINT_COST_FOR_ATTEMPTS) {
                showFeedback(`提示点不足，需要 ${HINT_COST_FOR_ATTEMPTS} 点`, 'error');
                return;
            }

            if (!confirm('确定要用 1 点提示点兑换 10 次提交机会吗？')) return;

            gameState.hintBalance -= HINT_COST_FOR_ATTEMPTS;

            const levelKey = String(gameState.level);
            if (!gameState.attemptsByLevel[levelKey]) {
                gameState.attemptsByLevel[levelKey] = INITIAL_ATTEMPTS;
            }
            gameState.attemptsByLevel[levelKey] += ATTEMPTS_PER_HINT;
            gameState.attempts = gameState.attemptsByLevel[levelKey];

            updateInfoDisplay();
            showFeedback(`兑换成功！第${gameState.level}关获得 ${ATTEMPTS_PER_HINT} 次提交机会`, 'success');
        }

        // ==================== 提取答案信息 ====================
        function showExtractInfo() {
            const completedCount = gameState.completedLevels.length;

            if (completedCount < 5) {
                showFeedback(`还需完成 ${5 - completedCount} 道题才能提取答案`, 'error');
                return;
            }

            const completedChars = gameState.completedLevels
                .sort((a, b) => a - b)
                .map(i => BLIND_LEVELS[i - 1].character);

            const message = `恭喜你已完成 ${completedCount} 道题！\n\n` +
                `你解出的汉字是：${completedChars.join(' ')}\n\n` +
                `你一共可以解出 6 个汉字，请在 6 个汉字中选取部件，拼凑成一个游戏名称。\n\n` +
                `提示：观察这些汉字的偏旁部首和结构。`;

            alert(message);
        }

        // ==================== 显示反馈信息 ====================
        function showFeedback(message, type) {
            feedbackEl.textContent = message;
            feedbackEl.className = `blind-feedback ${type}`;
        }

        function clearFeedback() {
            feedbackEl.textContent = '';
            feedbackEl.className = 'blind-feedback';
        }

        // ==================== 更新信息显示 ====================
        function updateInfoDisplay() {
            levelDisplay.textContent = gameState.level;
            totalLevelsDisplay.textContent = gameState.totalLevels;
            attemptsDisplay.textContent = gameState.attempts;
            hintsDisplay.textContent = gameState.hintBalance.toFixed(2);

            const rule = EXTRA_RULES[gameState.level];
            if (extraRulesEl) {
                // 如果禁用了附加规则，则不显示
                if (gameState.disableRules) {
                    extraRulesEl.textContent = '（附加规则已禁用）';
                    extraRulesEl.style.display = 'block';
                } else if (rule) {
                    extraRulesEl.textContent = rule;
                    extraRulesEl.style.display = 'block';
                } else {
                    extraRulesEl.textContent = '';
                    extraRulesEl.style.display = 'none';
                }
            }
        }

        // ==================== 渲染关卡导航 ====================
        function renderLevelNav() {
            levelNavEl.innerHTML = '';

            for (let i = 1; i <= gameState.totalLevels; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.className = 'blind-level-btn';

                if (i === gameState.level) {
                    btn.classList.add('active');
                }
                if (gameState.completedLevels.includes(i)) {
                    btn.classList.add('completed');
                }

                btn.addEventListener('click', () => switchLevel(i));
                levelNavEl.appendChild(btn);
            }

            if (gameState.completedLevels.length >= 5) {
                const extractBtn = document.createElement('button');
                extractBtn.textContent = '📝 提取答案';
                extractBtn.className = 'blind-extract-btn';
                extractBtn.addEventListener('click', showExtractInfo);
                levelNavEl.appendChild(extractBtn);
            }
        }

        // ==================== 切换关卡 ====================
        function switchLevel(level) {
            gameState.level = level;

            const levelKey = String(level);
            if (!gameState.attemptsByLevel[levelKey]) {
                gameState.attemptsByLevel[levelKey] = INITIAL_ATTEMPTS;
            }
            gameState.attempts = gameState.attemptsByLevel[levelKey];

            updateInfoDisplay();
            resetProbes();
            clearFeedback();

            const levelData = BLIND_LEVELS[level - 1];
            if (gameState.completedLevels.includes(level)) {
                showFeedback(`第${level}关答案：${levelData.character}`, 'success');
            }

            renderLevelNav();
        }

        // ==================== 重置所有进度 ====================
        function resetAllProgress() {
            if (!confirm('确定要重置所有进度吗？这将清除所有已完成关卡和提示点余额。')) return;

            gameState = {
                level: 1,
                attempts: INITIAL_ATTEMPTS,
                completedLevels: [],
                totalLevels: 6,
                showGrid: true,
                showChar: false,
                disableRules: false,
                hintBalance: INITIAL_HINTS,
                attemptsByLevel: {},
            };

            // 重置探针位置
            probeA.x = 50;
            probeA.y = 200;
            probeB.x = 350;
            probeB.y = 200;

            // 重置 checkbox 状态
            showCharCheckbox.checked = false;
            disableRulesCheckbox.checked = false;

            inputField.value = '';
            clearFeedback();
            updateInfoDisplay();
            renderLevelNav();
            resetProbes();

            showFeedback('所有进度已重置', 'info');
        }

        // ==================== 绑定事件监听器 ====================
        function bindEventListeners() {
            canvas.addEventListener('mousedown', handlePointerDown);
            canvas.addEventListener('mousemove', handlePointerMove);
            canvas.addEventListener('mouseup', handlePointerUp);
            canvas.addEventListener('mouseleave', handlePointerUp);

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (e.touches.length > 0) {
                    handlePointerDown({
                        clientX: e.touches[0].clientX,
                        clientY: e.touches[0].clientY,
                    });
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (e.touches.length > 0) {
                    handlePointerMove({
                        clientX: e.touches[0].clientX,
                        clientY: e.touches[0].clientY,
                    });
                }
            }, { passive: false });

            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                handlePointerUp();
            }, { passive: false });

            canvas.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                handlePointerUp();
            }, { passive: false });

            submitBtn.addEventListener('click', submitAnswer);
            inputField.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') submitAnswer();
            });

            resetBtn.addEventListener('click', resetProbes);
            exchangeBtn.addEventListener('click', exchangeHints);
            toggleGridBtn.addEventListener('click', () => {
                gameState.showGrid = !gameState.showGrid;
                drawCanvas();
            });

            // 显示汉字 checkbox
            showCharCheckbox.addEventListener('change', (e) => {
                gameState.showChar = e.target.checked;
                drawCanvas();
            });

            // 禁用附加规则 checkbox
            disableRulesCheckbox.addEventListener('change', (e) => {
                gameState.disableRules = e.target.checked;
                updateInfoDisplay();
                drawCanvas();
            });

            // 开发版功能按钮
            resetAllBtn.addEventListener('click', resetAllProgress);
        }

        // ==================== 页面加载完成后初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            // 获取 DOM 元素
            canvas = document.getElementById('blind-canvas');
            ctx = canvas.getContext('2d');

            levelDisplay = document.getElementById('blind-level-display');
            totalLevelsDisplay = document.getElementById('blind-total-levels');
            attemptsDisplay = document.getElementById('blind-attempts-display');
            hintsDisplay = document.getElementById('blind-hints-display');
            ratioDisplay = document.getElementById('blind-ratio-display');
            inputField = document.getElementById('blind-input');
            submitBtn = document.getElementById('blind-submit-btn');
            resetBtn = document.getElementById('blind-reset-btn');
            toggleGridBtn = document.getElementById('blind-toggle-grid-btn');
            exchangeBtn = document.getElementById('blind-exchange-btn');
            feedbackEl = document.getElementById('blind-feedback');
            levelNavEl = document.getElementById('blind-level-nav');
            extraRulesEl = document.getElementById('blind-extra-rules');

            // 开发版元素
            resetAllBtn = document.getElementById('blind-reset-all-btn');
            showCharCheckbox = document.getElementById('show-char-checkbox');
            disableRulesCheckbox = document.getElementById('disable-rules-checkbox');

            // 预生成像素掩码
            preloadPixelMasks();

            // 渲染关卡导航
            renderLevelNav();
            updateInfoDisplay();

            // 重置探针位置
            resetProbes();

            // 绑定事件监听器
            bindEventListeners();

            console.log('游戏初始化完成！');
        });

        function logImage(url, text, startColor, endColor, layers, size = 50) {
            let rtext = text + ' '.repeat(parseInt(layers / 10))

            const hexToRgb = (hex) => {
                const bigint = parseInt(hex.replace('#', ''), 16);
                return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
            };

            const rgbToHex = (r, g, b) => {
                return '#' + [r, g, b].map(x => {
                    const hex = x.toString(16);
                    return hex.length === 1 ? '0' + hex : hex;
                }).join('');
            };

            const c1 = hexToRgb(startColor);
            const c2 = hexToRgb(endColor);
            let shadows = [];

            for (let i = 1; i <= layers; i++) {
                const t = i / layers;
                const r = Math.round(c1.r + (c2.r - c1.r) * t);
                const g = Math.round(c1.g + (c2.g - c1.g) * t);
                const b = Math.round(c1.b + (c2.b - c1.b) * t);
                const color = rgbToHex(r, g, b);
                shadows.push(`${color} ${i}px ${i}px`);
            }

            const shadowString = shadows.join(', ');

            const css = `
                font-size: 40px;
                font-weight: 900;
                color: #FFFFFF;
                text-shadow: ${shadowString};
                font-family: sans-serif;
                line-height: 1.5;
            `;

            console.log(`%c      %c\n${rtext}\n`, `font-size: ${size}px; background-image: url(${url}); background-size: contain; background-repeat: no-repeat;`, css);
        }
